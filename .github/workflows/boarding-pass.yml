name: Boarding Pass APK

on:
  push:
    paths:
      - "boarding-pass/**"
      - ".github/workflows/boarding-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boarding-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boarding-pass
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets"
          else
            echo "Signing with the bundled key (app/signing/boardingpass.jks)"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BoardingPass.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/BoardingPass-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BoardingPass-1.0.${{ github.run_number }}
          path: boarding-pass/out/*.apk
          if-no-files-found: error

      # One pre-release per branch: "boarding-pass-latest" for the default branch,
      # "boarding-pass-<branch>" otherwise. Assets are replaced in place, so the release
      # never disappears mid-run and the download links stay the same between builds.
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            TAG=boarding-pass-latest
          else
            TAG="boarding-pass-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          cat > notes.md <<NOTES
          Сборка 1.0.${VERSION_CODE} из \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          * **BoardingPass.apk** — основная версия, ставить её.
          * **BoardingPass-debug.apk** — отладочная, ставится отдельным приложением рядом с основной.

          Android 8.0+, arm64. При установке разрешите «Установку из неизвестных источников».
          NOTES
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          TITLE="Посадочные 1.0.${VERSION_CODE} (${GITHUB_REF_NAME})"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/BoardingPass.apk out/BoardingPass-debug.apk --clobber
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" out/BoardingPass.apk out/BoardingPass-debug.apk \
              --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          fi
